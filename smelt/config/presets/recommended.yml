# Built-in base for `extends: smelt:recommended`. It travels with the installed
# Smelt version: upgrading Smelt can add newly cataloged rules.
#
# Every rule runs with its catalog severity. Hints need judgment and are listed
# with --show-hints or on changed code. Parameterized rules use their built-in
# defaults until structure or a package contract sets an option. Architecture
# policies still need the project's own layers, features and contracts.
#
# The conventions below are off: either spelling is valid, so a project chooses
# one deliberately. A project rules entry, family or ALL replaces this base.
rules:
  ALL: on
  layout/definition-order: off
  layout/callee-before-caller: off
  layout/misplaced-static-helper: off
  layout/misplaced-private-constant: off
  layout/redundant-module-name: off
  idioms/bundled-instance-assignment: off
  idioms/prefer-callable-instance: off
  modeling/forbidden-base-class-affix: off
  modeling/str-enum-value-convention: off
  visibility/misplaced-dunder-all: off
  typing/prefer-deferred-annotations: off
