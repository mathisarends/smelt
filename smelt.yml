# yaml-language-server: $schema=smelt.schema.json
# Run `uv run smelt check` from the repository root.
version: 2

project:
  root_packages: [smelt]
  source_roots: ["."]
  test_roots: [tests]
  exclude:
    - path: "tests/fixtures/**"
      reason: Deliberately violating example projects, checked by the test suite.
    - path: "scripts/**"
      reason: Maintainer schema and documentation generator, checked by Ruff and test_docs.

architecture:
  # The documentation generator can use shared code without owning a layer.
  shared: [smelt.docs]
  composition_root: [smelt.__main__]

  layers:
    config:
      path: config
      third_party: {default: deny, allow: [pydantic, pydantic_core, yaml]}
      may_depend_on: []

    model:
      path: model
      may_depend_on: [config]

    analysis:
      path: analysis
      may_depend_on: [config, model]

    diagnostics:
      path: diagnostics
      may_depend_on: [config]

    rules:
      path: rules
      may_depend_on: [analysis, config, diagnostics, model]

    engine:
      path: engine
      may_depend_on: [analysis, config, diagnostics, model, rules]

    cli:
      path: cli
      may_depend_on: [analysis, config, diagnostics, engine, model, rules]

  import_graph:
    type_checking: include
    transitive: true

  packages:
    model-api:
      match: smelt.model
      required: [architecture]
      public: ['.']
      min_imports_to_bundle: 2
      min_importers_to_export: 2

style:
  # Keep imports and module layout consistent across production packages.
  forbidden_names: [utils, helpers]
  imports: {style: absolute}
  private_modules: forbid
  future_annotations: when-needed
  reexports: all
  ordering: {fix: safe-only}
  file_naming:
    yaml_extension: yml

  # All Pydantic input models reject unknown fields through this project base.
  bases:
    pydantic.BaseModel: smelt.config.input_model.InputModel

  dataclass_options: [slots]
  call_argument_kinds: [await]

  overrides:
    analysis-errors:
      match: smelt.analysis
      errors: {base: smelt.analysis.errors.AnalysisError}
      rules:
        modeling/prefer-domain-exception: warning

    type-dispatch:
      match: smelt.rules.structure
      type_dispatch: {style: match, min_branches: 3}

tests:
  layout: mirror
  # Rule tests exercise the checker on real source fixtures.
  forbidden_mock_paths: ['tests/rules/**']

rules:
  # Source coverage, layer dependencies and package APIs.
  architecture/composition-root-leak: error
  architecture/forbidden-third-party-import: error
  architecture/import-cycle: error
  architecture/layer-boundary: error
  architecture/missing-facade-export: hint
  architecture/missing-required-module: error
  architecture/non-public-module-import: error
  architecture/shared-imports-feature: error
  architecture/unclassified-module: error
  architecture/uncovered-source: error

  # Keep decisions and collaborator calls readable.
  complexity/duplicate-function: warning
  complexity/duplicate-parameter-group: hint
  complexity/excess-attribute-depth: warning
  complexity/excess-comprehension-loops: hint
  complexity/excess-constructor-decisions: hint
  complexity/excess-positional-parameters: {severity: warning, max: 3}
  complexity/forbidden-nested-conditional: warning
  complexity/inline-call-argument: warning
  complexity/inline-constructor-receiver: warning

  # Framework-specific checks apply when their imports are present.
  frameworks/prefer-secret-type: warning
  frameworks/redundant-dishka-provider: warning

  # Prefer explicit control flow and interface contracts.
  idioms/bundled-instance-assignment: error
  idioms/duplicate-narrowing-assert: warning
  idioms/loop-invariant-collection: warning
  idioms/missing-broad-except-reason: warning
  idioms/missing-interface-docstring: warning
  idioms/prefer-callable-instance: hint
  idioms/prefer-match-type-dispatch: error
  idioms/redundant-getattr: warning
  idioms/redundant-name-alias: warning

  # Import through the owning package where it exposes an API.
  imports/excess-module-imports: hint
  imports/excess-package-imports: hint
  imports/forbidden-import-style: error
  imports/prefer-package-import: warning

  # File names, definition order and module organization.
  layout/callee-before-caller: warning
  layout/definition-order: error
  layout/file-name-convention: error
  layout/forbidden-module-name: error
  layout/forbidden-private-module: error
  layout/misplaced-module-logger: warning
  layout/misplaced-private-constant: error
  layout/misplaced-static-helper: warning
  layout/redundant-comment: warning
  layout/redundant-module-name: warning
  layout/reexport-only-module: error

  # Explain suppressions so reviewers can reevaluate them.
  meta/missing-tool-suppression-reason: warning

  # Use consistent model contracts and explicit serialized enum values.
  modeling/dataclass-field-mutation: error
  modeling/duplicate-class-name: warning
  modeling/forbidden-base-class-affix: error
  modeling/implicit-duration-unit: error
  modeling/missing-dataclass-option: warning
  # Frozen records can own mutable caches. Review ownership at each finding.
  modeling/mutable-field-in-frozen-dataclass: hint
  modeling/parallel-record-fields: hint
  modeling/prefer-error-name: error
  modeling/prefer-project-base-class: error
  # A single-value Literal field alone does not establish union membership.
  modeling/prefer-str-enum-discriminator: hint
  modeling/redundant-str-enum-value: warning
  modeling/str-enum-value-convention: warning

  # Mirrored layout, deterministic data and observable outcomes.
  tests/excess-patches: {severity: error, max: 2}
  tests/forbidden-mock: error
  tests/independent-case-loop: warning
  tests/misplaced-test: error
  tests/missing-await-assertion: warning
  # CLI and integration tests also exercise modules through their callers.
  tests/missing-mirror-test: hint
  tests/missing-outcome-check: warning
  tests/missing-skip-reason: error
  tests/nondeterministic-data: error
  tests/private-access: error
  tests/string-patch-target: error
  tests/unbounded-wait: error
  tests/vacuous-assertion: error

  # Static types, annotation evaluation and optional defaults.
  # Equal tuple shapes and repeated literals can represent distinct concepts.
  typing/anonymous-tuple-type: hint
  typing/deprecated-async-contextmanager-return: warning
  typing/duplicate-literal-type: hint
  typing/forbidden-future-annotations: error
  typing/implicit-optional-default: error
  typing/prefer-deferred-annotations: error
  typing/prefer-inline-type-parameters: error
  typing/redundant-future-annotations: error

  # Keep implementation details private and exports deliberate.
  # Review cohesion before splitting parsers, renderers or model modules.
  visibility/deep-package-reexport: error
  visibility/excess-private-definitions: hint
  visibility/foreign-private-access: error
  visibility/internal-public-attribute: error
  visibility/internal-public-member: error
  visibility/internal-public-module-symbol: error
  visibility/misplaced-dunder-all: error
  visibility/redundant-private-delegate: error
  visibility/reexport-convention: error
  visibility/test-only-public-attribute: error
  visibility/test-only-public-function: error

ignore:
  - rule: layout/file-name-convention
    paths: [.pre-commit-hooks.yaml]
    reason: pre-commit discovers published hooks by this exact manifest filename.
