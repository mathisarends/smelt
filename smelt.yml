# smelt checks itself. Run `smelt check` (or `uv run smelt check`) from the repo root.
version: 1

project:
  root_packages: [smelt]
  source_roots: ["."]
  test_roots: [tests]
  coverage: strict
  exclude:
    - path: "tests/fixtures/**"
      reason: Deliberately violating example projects, checked by the test suite.
    - path: "scripts/**"
      reason: Maintainer schema and documentation generator, checked by Ruff and test_docs.

architecture:
  # The doc generator is a tool for the repo, not part of any layer.
  shared: [smelt.docs]
  composition_root: [smelt.__main__]

  layers:
    config:
      path: config
      may_depend_on: []
    model:
      path: model
      may_depend_on: [config]
    analysis:
      path: analysis
      may_depend_on: [config, model]
    diagnostics:
      path: diagnostics
      may_depend_on: [config]
    rules:
      path: rules
      may_depend_on: [analysis, config, diagnostics, model]
    engine:
      path: engine
      may_depend_on: [analysis, config, diagnostics, model, rules]
    cli:
      path: cli
      may_depend_on: [analysis, config, diagnostics, engine, model, rules]

  imports:
    type_checking: include
    transitive: true

structure:
  forbidden_names: [utils, helpers]
  call_argument_kinds: [await]
  contracts:
    maintainability:
      match: smelt
      future_annotations: when-needed
      ordering: {fix: safe-only}
      max_positional_parameters: 3
      dataclass_options: [slots]
    module-names:
      match: smelt
      private_modules: forbid
    instance-fields:
      match: smelt
      rules: {idioms/bundled-instance-assignment: error}
    type-dispatch:
      match: smelt.rules.structure
      type_dispatch: {style: match, min_branches: 3}
    model-api:
      match: smelt.model
      required: [architecture]
      public: ['.']
      bundle_imports_at: 2

tests:
  layout: mirror

rules:
  # Public values are serialized in reports: keep their wire spelling explicit.
  modeling/str-enum-value-convention: warning
  typing/deprecated-async-contextmanager-return: warning
  visibility/foreign-private-access: warning
  complexity/inline-call-argument: warning
  visibility/redundant-private-delegate: warning
  idioms/redundant-name-alias: warning
  typing/prefer-deferred-annotations: warning
  idioms/missing-interface-docstring: warning
  modeling/stateful-dataclass: warning
  complexity/duplicate-function: warning
  idioms/missing-broad-except-reason: warning
  modeling/duplicate-class-name: warning
  idioms/duplicate-narrowing-assert: warning
  modeling/implicit-duration-unit: warning
  # These reviews need semantic judgment: equal shapes can model distinct concepts.
  typing/duplicate-literal-type: hint
  typing/anonymous-tuple-type: hint
  layout/callee-before-caller: warning
  frameworks/redundant-dishka-provider: warning
  frameworks/prefer-secret-type: warning
  modeling/forbidden-base-class-affix: error
  visibility/misplaced-dunder-all: error
  tests/nondeterministic-data: error
  imports/prefer-package-import: warning
  complexity/deep-object-navigation: warning
  architecture/import-cycle: error
  idioms/prefer-match-type-dispatch: error
  layout/definition-order: error
  layout/misplaced-private-constant: error
  information-hiding: warning
  layout/misplaced-static-helper: warning
  typing/redundant-future-annotations: warning
  tests/private-access: warning
  tests/missing-outcome-check: warning
  tests/vacuous-assertion: warning
  tests/unbounded-wait: warning
  tests/independent-case-loop: warning
  tests/missing-await-assertion: warning
# yaml-language-server: $schema=smelt.schema.json
