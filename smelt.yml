# smelt checks itself. Run `smelt check` (or `uv run smelt check`) from the repo root.
version: 1

project:
  root_packages: [smelt]
  source_roots: ["."]
  test_roots: [tests]
  coverage: strict
  exclude:
    - path: "tests/fixtures/**"
      reason: Deliberately violating example projects, checked by the test suite.
    - path: "scripts/**"
      reason: Maintainer schema and documentation generator, checked by Ruff and test_docs.

architecture:
  # The doc generator is a tool for the repo, not part of any layer.
  shared: [smelt.docs]
  composition_root: [smelt.__main__]

  layers:
    config:
      path: config
      may_depend_on: []
    model:
      path: model
      may_depend_on: [config]
    analysis:
      path: analysis
      may_depend_on: [config, model]
    diagnostics:
      path: diagnostics
      may_depend_on: [config]
    rules:
      path: rules
      may_depend_on: [analysis, config, diagnostics, model]
    engine:
      path: engine
      may_depend_on: [analysis, config, diagnostics, model, rules]
    cli:
      path: cli
      may_depend_on: [analysis, config, diagnostics, engine, model, rules]

  imports:
    type_checking: include
    transitive: true

structure:
  forbidden_names: [utils, helpers]
  contracts:
    maintainability:
      match: smelt
      future_annotations: when-needed
      ordering: {fix: safe-only}
      max_positional_parameters: 3
    module-names:
      match: smelt
      private_modules: forbid
    instance-fields:
      match: smelt
      rules: {bundled-instance-assignment: error}
    type-dispatch:
      match: smelt.rules.structure
      type_dispatch: {style: match, min_branches: 3}
    model-api:
      match: smelt.model
      required: [architecture]
      public: ['.']
      bundle_imports_at: 2

tests:
  layout: mirror

rules:
  # Public values are serialized in reports: keep their wire spelling explicit.
  str-enum-explicit-values: warning
  deprecated-async-contextmanager-return: warning
  private-symbol-import: warning
  await-in-call-argument: warning
  redundant-private-delegate: warning
  redundant-name-alias: warning
  prefer-deferred-annotations: warning
  # These reviews need semantic judgment: equal shapes can model distinct concepts.
  duplicate-literal-type: hint
  anonymous-tuple-type: hint
  caller-before-callee: warning
  redundant-dishka-provider: warning
  secret-settings-field: warning
  no-base-class-suffix: error
  package-only-dunder-all: error
  nondeterministic-test-data: error
  prefer-package-import: warning
  no-base-class-prefix: error
  deep-object-navigation: warning
  import-cycle: error
  prefer-match-type-dispatch: error
  public-definitions-first: error
  private-class-constant: error
  information-hiding: warning
  internal-static-helper: warning
  unnecessary-future-annotations: warning
  private-test-access: warning
  test-without-outcome-check: warning
  test-only-checks-possibly-empty-data: warning
  unbounded-test-wait: warning
  independent-test-case-loop: warning
  async-mock-without-await-check: warning
# yaml-language-server: $schema=smelt.schema.json
