[package]
name = "smelt-cli"
version = "0.16.1"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Native client for Smelt's Python guardrail engine"
repository = "https://github.com/mathisarends/smelt"

[[bin]]
name = "smelt"
path = "native/main.rs"

[dependencies]
base64 = "0.22"
gix = { version = "0.90", default-features = false, features = ["index", "sha1", "sha256"] }
rayon = "1"
regex = "1"
ruff_python_ast = "=0.0.23"
ruff_python_parser = "=0.0.23"
ruff_text_size = "=0.0.23"
saphyr-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = { version = "0.9", default-features = false, features = ["parse", "preserve_order", "serde"] }
unicode-ident = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
