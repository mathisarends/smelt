[package]
name = "smelt-cli"
version = "0.16.1"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Native client for Smelt's Python guardrail engine"
repository = "https://github.com/mathisarends/smelt"

[[bin]]
name = "smelt"
path = "native/main.rs"

[dependencies]
base64 = "0.22"
gix = { version = "0.90", default-features = false, features = ["index", "sha1", "sha256"] }
rayon = "1"
regex = "1"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-ident = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
