name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Clippy adds debug artifacts, so lint keeps its own cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yml', 'uv.lock') }}
      - run: uv sync --locked
      - name: Check generated catalog, rule docs and skill references for drift
        run: uv run --frozen python scripts/generate.py --check
      - run: uv run prek run --all-files --show-diff-on-failure

  hook-latency:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # The release build of the native client is the same in these jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yml', 'uv.lock') }}
      - name: Compare staged edit latency against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen python scripts/benchmark_staged_edits.py --base "$BASE_SHA" --output hook-times.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: staged-hook-times
          path: hook-times.json

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The release build of the native client is the same in these jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -n auto --cov --cov-report=term-missing

  smelt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The release build of the native client is the same in these jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: .smelt_cache
          key: ${{ runner.os }}-smelt-v2-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-smelt-v2-${{ hashFiles('uv.lock') }}-
      - run: uv sync --locked
      - run: uv run smelt check --strict-coverage --fail-on warning --format github

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - name: Build the Linux release wheel through the same PyPI-backed path
        if: runner.os == 'Linux'
        run: |
          docker run --rm --volume "${{ github.workspace }}:/io" --workdir /io \
            quay.io/pypa/manylinux_2_28_x86_64:latest \
            bash scripts/build_linux_wheel.sh
      - name: Cross-compile and audit the Linux ARM64 release wheel
        if: runner.os == 'Linux'
        run: |
          docker run --rm --volume "${{ github.workspace }}:/io" --workdir /io \
            ghcr.io/rust-cross/manylinux_2_28-cross:aarch64 \
            bash scripts/build_linux_wheel.sh aarch64-unknown-linux-gnu dist/arm64
      - name: Install and smoke-test the built wheel outside the checkout
        run: |
          uv run --no-project --python 3.12 python scripts/smoke_distribution.py dist

  package-musl:
    name: Package (musllinux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build and audit the musllinux release wheel
        run: |
          docker run --rm --volume "${{ github.workspace }}:/io" --workdir /io \
            "quay.io/pypa/musllinux_1_2_${{ matrix.arch }}:latest" \
            bash scripts/build_linux_wheel.sh "${{ matrix.arch }}-unknown-linux-musl"
      - name: Install and smoke-test the wheel on Alpine
        run: |
          docker run --rm --volume "${{ github.workspace }}:/io" --workdir /io \
            python:3.12-alpine \
            sh -c "python -m pip install --disable-pip-version-check --root-user-action=ignore uv && python scripts/smoke_distribution.py dist"
