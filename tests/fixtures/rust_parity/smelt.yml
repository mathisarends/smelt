# Edge cases the Rust core must report exactly like the Python engine.
version: 2

project:
  root_packages: [parity]
  source_roots: ["."]
  test_roots: []

style:
  type_dispatch: {style: match, min_branches: 2}
  bases:
    pydantic.BaseModel: parity.modeling.base.Options
    external.Base: parity.modeling.base.Options
  errors: {base: parity.domain_errors.base.AppError, allow: [TypeError]}
  overrides:
    errors_lifted:
      match: parity.domain_errors.free
      errors: {}
    errors_strict:
      match: parity.domain_errors.strict
      errors: {base: parity.domain_errors.base.StrictError}
    relaxed:
      match: parity.relaxed
      type_dispatch: {style: match, min_branches: 4}
      rules:
        complexity/excess-positional-parameters: {severity: hint, max: 4}
        complexity/excess-comprehension-loops: {severity: hint, max: 3}
        complexity/excess-constructor-decisions: {severity: hint, max: 4}
        visibility/excess-private-definitions: {severity: hint, max: 1}
    free_bases:
      match: parity.modeling.free
      bases: {}
    dispatch_off:
      match: parity.versioned.allowed
      type_dispatch: {style: allow}
    silenced:
      match: parity.silenced
      rules:
        complexity/forbidden-nested-conditional: "off"

rules:
  complexity/excess-positional-parameters: {severity: warning, max: 2}
  complexity/forbidden-nested-conditional: hint

ignore:
  - rule: complexity/excess-positional-parameters
    paths: ["parity/ignored.py"]
    reason: Exercises path ignores in the parity comparison.
