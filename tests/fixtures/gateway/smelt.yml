version: 1
rules:
  SMT104: error
  architecture/layer-boundary: error
  architecture/cross-feature-import: error
  architecture/forbidden-third-party-import: error
  architecture/shared-imports-feature: error
  architecture/composition-root-leak: error

project:
  root_packages: [gateway]
  source_roots: [src]
  test_roots: [tests]

architecture:
  features:
    root: gateway.features
  shared: [gateway.shared]
  composition_root: [gateway.bootstrap, gateway.main]
  layers:
    domain:
      path: domain
      may_depend_on: []
      third_party:
        default: deny
        allow: [pydantic]
    application:
      path: application
      may_depend_on: [domain]
      third_party:
        default: allow
        deny: [fastapi, sqlalchemy, dishka]
    infrastructure:
      path: infra
      may_depend_on: [domain, application]
    presentation:
      path: api
      may_depend_on: [application]
  cross_feature:
    default: deny
    allow: ["application -> application"]
