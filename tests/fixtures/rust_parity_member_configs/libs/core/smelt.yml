# A member with its own feature architecture and rule refinements.
version: 2

project:
  exclude:
    - path: src/core/generated.py
      reason: Generated by the schema compiler.

architecture:
  features: {root: core.features}
  shared: [core.shared]
  layers:
    domain:
      path: domain
    application:
      path: application
      may_depend_on: [domain]

style:
  overrides:
    relaxed:
      match: core.features.one
      imports:
        value: {style: relative, max_relative_level: 1}
        reason: The loose module predates the absolute style.

rules:
  architecture/unclassified-module: {severity: hint, reason: The core member is still being sliced.}
  complexity/forbidden-nested-conditional: hint

ignore:
  - rule: complexity/excess-positional-parameters
    paths: ["src/core/features/one/legacy.py"]
    reason: The legacy signature is kept for callers.
