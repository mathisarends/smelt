[project]
name = "smelt"
version = "0.1.0"
description = "Static guardrails for Python codebases maintained by humans and coding agents."
readme = "README.md"
authors = [{ name = "Mathis Arends", email = "mathisarends27@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "grimp>=3.17",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
smelt = "smelt.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["tests/fixtures"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented-out code)
    "PL",    # pylint
    "PERF",  # perflint
    "FURB",  # refurb
    "RUF",   # ruff-specific
    "S",     # flake8-bandit
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is fine in tests
    "PLR2004", # magic values are fine in tests
]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# Mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
files = ["smelt", "tests"]
exclude = ["^tests/fixtures/"]

# --------------------------------------------------------------------------- #
# Pytest / Coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["smelt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
